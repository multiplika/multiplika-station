<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; script-src 'self'" />
  <link rel="icon" type="image/png" href="../assets/icono-multiplika.png" />
  <link rel="stylesheet" href="../assets/fonts.css" />
  <title>Multiplika</title>
  <style>
    :root {
      --bg: #fafbfc;
      --tab-hover: rgba(0,0,0,0.05);
      --tab-active: #ffffff;
      --text-active: #1a1c1e;
      --muted: #6a7078;
      --accent: #2563eb;
      --shadow: 0 1px 4px rgba(0,0,0,0.14);
      --close-hover: rgba(0,0,0,0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2023;
        --tab-hover: rgba(255,255,255,0.06);
        --tab-active: #34363b;
        --text-active: #f5f6f7;
        --muted: #9aa0a6;
        --accent: #6ea0ff;
        --shadow: 0 1px 4px rgba(0,0,0,0.45);
        --close-hover: rgba(255,255,255,0.14);
      }
    }

    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body {
      margin: 0; height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      overflow: hidden;
    }

    /* ---- Barra superior: tres zonas (izquierda fija, centro con scroll, derecha fija) ---- */
    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      background: var(--bg);
    }

    /* Zona central: pestañas con scroll horizontal. */
    .tabbar {
      flex: 1 1 auto;
      min-width: 0;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }
    .tabbar::-webkit-scrollbar { display: none; }

    /* ---- Botones de icono fijos (Panel de control / Configuración) ---- */
    .iconbtn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 9px; background: transparent;
      color: var(--muted); cursor: pointer;
      flex: 0 0 auto;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .iconbtn:hover { background: var(--tab-hover); color: var(--text-active); }
    .iconbtn.active {
      background: var(--tab-active);
      color: var(--accent);
      box-shadow: var(--shadow);
    }
    .iconbtn svg { width: 18px; height: 18px; }

    /* Separadores entre los botones fijos y las pestañas. */
    .divider {
      width: 1px; height: 20px;
      background: var(--close-hover);
      flex: 0 0 auto;
      margin: 0 3px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 132px;
      max-width: 240px;
      height: 34px;
      padding: 0 8px 0 13px;
      background: transparent;
      border-radius: 10px;
      color: var(--muted);
      cursor: default;
      flex: 0 1 auto;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .tab:hover { background: var(--tab-hover); }
    .tab.active {
      background: var(--tab-active);
      color: var(--text-active);
      box-shadow: var(--shadow);
    }

    /* Favicon de la página en la pestaña */
    .tab .favicon {
      width: 15px; height: 15px;
      border-radius: 3px;
      flex: 0 0 auto;
      object-fit: contain;
      -webkit-user-drag: none;
    }

    /* Punto indicador (si la web no tiene favicon) */
    .tab .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.35;
      flex: 0 0 auto;
      transition: opacity 0.16s ease, background 0.16s ease;
    }
    .tab.active .dot { background: var(--accent); opacity: 1; }

    .tab .title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .tab .close {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      color: var(--muted);
      flex: 0 0 auto;
      opacity: 0;
      transition: opacity 0.12s ease, background 0.12s ease;
    }
    .tab:hover .close, .tab.active .close { opacity: 1; }
    .tab .close:hover { background: var(--close-hover); color: var(--text-active); }
    .tab .close svg { width: 11px; height: 11px; }

    .newtab {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 9px; background: transparent;
      color: var(--muted); cursor: pointer;
      flex: 0 0 auto;
      transition: background 0.16s ease, color 0.16s ease;
    }
    .newtab:hover { background: var(--tab-hover); color: var(--text-active); }
    .newtab svg { width: 17px; height: 17px; }
  </style>
</head>
<body>
  <div class="topbar">
    <!-- Panel de control: fijo a la izquierda. -->
    <button class="iconbtn" id="dashBtn" title="Panel de control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <span class="divider"></span>

    <!-- Pestañas (zona central con scroll). -->
    <div class="tabbar" id="tabbar"></div>

    <!-- Configuración: fijo a la derecha del todo. -->
    <span class="divider"></span>
    <button class="iconbtn" id="settingsBtn" title="Configuración">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <script src="shell.js"></script>
</body>
</html>
