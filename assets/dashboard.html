<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="fonts.css" />
  <title>Panel de control</title>
  <style>
    :root {
      --bg: #fafbfc;
      --card: #ffffff;
      --text: #1a1c1e;
      --muted: #6a7078;
      --border: rgba(0,0,0,0.08);
      --shadow: 0 1px 4px rgba(0,0,0,0.10);
      --shadow-hover: 0 6px 20px rgba(0,0,0,0.12);
      --accent: #2563eb;
      --accent-press: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2023;
        --card: #26282c;
        --text: #f5f6f7;
        --muted: #9aa0a6;
        --border: rgba(255,255,255,0.09);
        --shadow: 0 1px 4px rgba(0,0,0,0.45);
        --shadow-hover: 0 6px 20px rgba(0,0,0,0.55);
        --accent: #6ea0ff;
        --accent-press: #4f86ee;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    body { overflow-y: auto; padding: 34px 28px 44px; }

    .panel { width: 100%; max-width: 820px; margin: 0 auto; }

    /* Logo principal centrado arriba. */
    .brand { text-align: center; margin: 6px 0 30px; }
    .brand img { width: 210px; max-width: 62%; height: auto; }
    .brand .slogan { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 12px 0 0; font-size: 14px; font-weight: 500; color: var(--muted); }
    /* En modo oscuro, el logo navy se muestra en blanco para que sea legible. */
    @media (prefers-color-scheme: dark) {
      .brand img { filter: brightness(0) invert(1); }
    }

    /* Cuadrícula de tarjetas cuadradas. */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    /* Acceso directo a una aplicación (tile cuadrado con su logo). */
    .app-card {
      --c: #888;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 130px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 4px;
      cursor: pointer;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }
    .app-card:hover {
      border-color: var(--c);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    .app-card:active { transform: translateY(0); }
    .app-card:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

    .app-card img {
      max-width: 98%;
      max-height: 98%;
      width: auto; height: auto;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    /* Modal para pedir la URL de una app sin configurar. */
    .modal-backdrop {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35);
      padding: 24px; z-index: 50;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.28);
      padding: 22px;
    }
    .modal h3 {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; font-weight: 600; margin: 0 0 6px;
    }
    .modal .desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .modal input {
      width: 100%;
      font: inherit; font-size: 13px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px;
      -webkit-user-select: text; user-select: text;
    }
    .modal input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .modal .btn {
      font: inherit; font-size: 13px; font-weight: 600;
      border-radius: 9px; padding: 9px 16px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .modal .btn:hover { background: var(--accent-press); border-color: var(--accent-press); }
    .modal .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .modal .btn.ghost:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand">
      <img src="logo-multiplika.png" alt="multiplika" />
      <p class="slogan">Juntos en la transformación digital</p>
    </div>

    <div class="grid">
      <button class="app-card" style="--c:oklch(0.76 0.15 66)" data-app="erp">
        <img src="app-erp.png" alt="multiplika ERP" />
      </button>

      <button class="app-card" style="--c:oklch(0.8 0.14 88)" data-app="plus">
        <img src="app-plus.png" alt="multiplika Plus" />
      </button>

      <button class="app-card" style="--c:oklch(0.62 0.15 195)" data-app="leia">
        <img src="app-leia.png" alt="multiplika Leia" />
      </button>
    </div>
  </div>

  <!-- Modal para pedir la URL de una app sin configurar. -->
  <div class="modal-backdrop" id="urlModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>Configurar enlace</h3>
      <p class="desc">Introduce la URL para <b id="urlModalApp"></b>:</p>
      <input type="text" id="urlModalInput" placeholder="https://…" spellcheck="false" />
      <div class="modal-actions">
        <button class="btn ghost" id="urlModalCancel">Cancelar</button>
        <button class="btn" id="urlModalOk">Guardar y abrir</button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
